name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not v<major>.<minor>.<patch>[-<suffix>]"
            exit 1
          fi
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build "-Pversion=$VERSION" --console=plain

      - name: Check plugin version in JAR
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          actual="$(unzip -p build/libs/bake-mechanisms.jar plugin.yml | sed -n "s/^version: '\(.*\)'$/\1/p")"
          if [[ "$actual" != "$VERSION" ]]; then
            echo "::error::plugin.yml has version '$actual', expected '$VERSION'"
            exit 1
          fi
          echo "plugin.yml version: $actual"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [[ "$PRERELEASE" == "true" ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" build/libs/bake-mechanisms.jar \
            --verify-tag \
            --title "Bake Mechanisms $VERSION" \
            --generate-notes \
            "${flags[@]}"
