# Maximum inclusive volume of one mechanism in blocks.
max-mechanism-volume: 262144

# Most output containers one new farm may have. Lowering it never drops farms registered earlier.
max-output-containers: 8

profiling:
  # Ticks between output snapshots during profiling.
  snapshot-interval: 20
  # Shortest useful segment (before the output fills up), in ticks.
  min-useful-ticks: 600
  # Feature flag: reject profiles whose useful segment is shorter than min-useful-ticks.
  reject-short-useful-segment: false

emulation:
  # Ticks between moving emulated items into the output container. Independent of profiling.snapshot-interval.
  update-interval: 20

stasis:
  filler:
    # Applies to new stasis operations; existing snapshots retain their own appearance.
    # AUTO faces the side with most output containers (a double chest counts once).
    # Ties prefer the widest face (SOUTH on a square), then NORTH/SOUTH/EAST/WEST order.
    # Or explicitly choose NORTH/SOUTH/EAST/WEST.
    front: AUTO
    # Local, mirrored patterns: BANDS or PANELS. No randomness or animation.
    pattern: BANDS
    patch-size: 3
    palette:
      # Outer surfaces must be glass: no bounce, sticky blocks, ticking blocks or mob-spawn surfaces.
      shell: LIME_STAINED_GLASS
      shade: GREEN_STAINED_GLASS
      face-glass: BLACK_STAINED_GLASS
      # Opaque materials are used only inside: concrete, terracotta or glass.
      core: LIME_TERRACOTTA
      accent: GREEN_CONCRETE
      face: BLACK_CONCRETE
