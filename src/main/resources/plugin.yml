name: BakeMechanisms
version: '${version}'
main: io.github.checkselfy.bakemechanisms.BakeMechanismsPlugin
api-version: '26.3'
description: Profiles and emulates resource-producing farms.
commands:
  bake:
    description: Разметка, профилирование, стазис, восстановление и удаление автоферм.
    usage: "/bake wand | select-output | unselect | register [name] | list | manage | info <farm> | rename <farm> <name> | profile <farm> | profile-long <farm> | sprint <farm> | cancel-profiling <farm> | stasis <farm> | unstasis <farm> | unregister <farm> [confirm]; <farm> is a name or --id <UUID>"
    aliases: [bm]
