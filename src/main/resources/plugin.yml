name: BakeMechanisms
version: '${version}'
main: io.github.checkselfy.bakemechanisms.BakeMechanismsPlugin
api-version: '26.3'
description: Profiles and emulates resource-producing farms.
commands:
  bake:
    description: Разметка, профилирование и проверочная эмуляция автоферм, просмотр их состояния.
    usage: /bake wand | output | register | list | info <UUID> | profile <UUID> | cancel <UUID> | start-emulate <UUID> | stop-emulate <UUID> | clear
    aliases: [bm]
